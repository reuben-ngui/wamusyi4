<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Merry-Go-Round</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
</head>
<body>
<main class="wrap" id="wrap">
  <header>
    <div class="crest" aria-hidden="true">★</div>
    <h1>Administrator</h1>
    <p class="sub">Merry-Go-Round Group</p>
  </header>

  <!-- LOGIN -->
  <section id="loginView" class="panel">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="cta" id="loginBtn">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <!-- DASHBOARD -->
  <section id="dash" class="hide">
    <div class="stats">
      <div><b id="stDone">0/4</b>selections completed</div>
      <div><b id="stPend">4</b>pending</div>
      <div><b id="stAvail">1 2 3 4</b>numbers available</div>
    </div>

    <p>
      <button class="btn gold" id="copyPublic">Copy public link</button>
      <button class="btn" id="csvBtn">Export CSV</button>
      <button class="btn danger" id="resetBtn">Reset all selections</button>
      <button class="btn" id="logoutBtn">Log out</button>
    </p>
    <p class="okmsg" id="note" role="status"></p>

    <h2>Members</h2>
    <div class="panel tw" style="padding:6px 12px">
      <table>
        <thead><tr><th>No.</th><th>Member name</th><th>Assigned number</th><th>Status</th><th>Selected at</th><th>Invitation</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="panel" id="inviteBox" style="display:none"></div>

    <h2>Register a member <span class="sub" id="slots"></span></h2>
    <div class="panel">
      <div class="row">
        <div><label for="mName">Name</label><input id="mName" maxlength="60"></div>
        <div><label for="mContact">Contact (optional)</label><input id="mContact" maxlength="120"></div>
        <button class="btn gold" id="addBtn" style="margin:0">Add member</button>
      </div>
      <p class="err" id="addErr" role="alert"></p>
    </div>

    <h2>Activity log</h2>
    <div class="panel tw" style="padding:6px 12px">
      <table><thead><tr><th>Time</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody id="audit"></tbody></table>
    </div>
  </section>
</main>

<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.key);
const $ = id => document.getElementById(id);
const root = new URL("../", location.href).href;          // public member page
const fmt = t => t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
let D = null, channel = null;

function el(tag, text, cls){ const e = document.createElement(tag); if(text !== undefined) e.textContent = text; if(cls) e.className = cls; return e; }
function note(t){ $("note").textContent = t; if(t) setTimeout(() => $("note").textContent === t && ($("note").textContent = ""), 4000); }
async function copy(t, msg){ try{ await navigator.clipboard.writeText(t); note(msg); }catch{ prompt("Copy this:", t); } }

/* ---------- auth ---------- */
async function enter(){
  const { data: s } = await sb.auth.getSession();
  if(!s.session){ $("loginView").classList.remove("hide"); $("dash").classList.add("hide"); return; }
  const { data: ok } = await sb.rpc("is_admin");
  if(!ok){ await sb.auth.signOut(); $("loginErr").textContent = "This account is not an administrator."; return; }
  $("loginView").classList.add("hide"); $("dash").classList.remove("hide");
  $("wrap").classList.add("wide");
  await load();
  if(!channel){
    channel = sb.channel("members-live").on("postgres_changes", { event: "*", schema: "public", table: "members" }, load).subscribe();
    setInterval(load, 10000);                         // fallback if realtime is not enabled
  }
}
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if(error){ $("loginErr").textContent = "Wrong email or password."; return; }
  $("pw").value = ""; enter();
};
$("pw").addEventListener("keydown", e => e.key === "Enter" && $("loginBtn").click());
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- data ---------- */
async function load(){
  const { data, error } = await sb.rpc("admin_overview");
  if(error || !data) return;
  D = data;
  const done = D.members.filter(m => m.number).length;
  $("stDone").textContent = done + "/4";
  $("stPend").textContent = 4 - done;
  $("stAvail").textContent = D.available.length ? D.available.join("  ") : "none";
  $("slots").textContent = "(" + D.members.length + " of 4 registered)";
  $("addBtn").disabled = D.members.length >= 4;

  const tb = $("rows"); tb.innerHTML = "";
  D.members.forEach((m, i) => {
    const tr = tb.insertRow();
    tr.insertCell().textContent = i + 1;
    tr.insertCell().textContent = m.name;
    const nc = tr.insertCell(); nc.textContent = m.number || "—"; nc.style.cssText = "font-weight:800;font-size:1.2rem;color:var(--gold2)";
    const sc = tr.insertCell(); sc.appendChild(el("span", m.number ? "Selected" : "Pending", "tag " + (m.number ? "s" : "p")));
    tr.insertCell().textContent = fmt(m.selected_at);
    tr.insertCell().textContent = m.invite_used ? "Used" : "Not used";
    const ac = tr.insertCell();
    const b1 = el("button", "New code / link", "btn sm"); b1.onclick = () => newCode(m);
    const b2 = el("button", "Remove", "btn sm danger"); b2.disabled = !!m.number; b2.title = m.number ? "Reset the draw to change members" : "";
    b2.onclick = () => removeMember(m);
    ac.append(b1, b2);
  });

  const ab = $("audit"); ab.innerHTML = "";
  D.audit.forEach(a => { const tr = ab.insertRow(); [fmt(a.at), a.actor, a.action, a.detail || ""].forEach(v => tr.insertCell().textContent = v); });
}

/* ---------- actions ---------- */
function showInvite(name, code){
  const link = root + "?c=" + code, box = $("inviteBox");
  box.style.display = ""; box.innerHTML = "";
  box.append(el("b", "Invitation for " + name), el("p", "Shown only once. Send it privately to this member. Only a scrambled version is stored.", "sub"));
  const d = el("div", "Link: " + link, "invite"), d2 = el("div", "Access code: " + code, "invite");
  const b = el("button", "Copy invitation link", "btn gold"); b.onclick = () => copy(link, "Invitation link copied.");
  const w = el("a", "Send on WhatsApp", "btn"); w.target = "_blank"; w.rel = "noopener";
  w.href = "https://wa.me/?text=" + encodeURIComponent("Hi " + name + ", pick your Merry-Go-Round number here: " + link + "  (access code: " + code + ")");
  w.style.textDecoration = "none"; w.style.display = "inline-block";
  box.append(d, d2, b, w); box.scrollIntoView({ behavior: "smooth" });
}

$("addBtn").onclick = async () => {
  $("addErr").textContent = "";
  const { data, error } = await sb.rpc("admin_add_member", { p_name: $("mName").value, p_contact: $("mContact").value });
  if(error || !data) { $("addErr").textContent = "Could not add member."; return; }
  if(!data.ok){ $("addErr").textContent = { full: "All four members are already registered.", duplicate: "A member with that name already exists.", no_name: "Enter a name." }[data.error]; return; }
  showInvite($("mName").value.trim(), data.code); $("mName").value = ""; $("mContact").value = ""; load();
};
async function newCode(m){
  if(!confirm("Create a new access code for " + m.name + "? Their old code will stop working.")) return;
  const { data } = await sb.rpc("admin_new_code", { p_id: m.id });
  if(data && data.ok) showInvite(m.name, data.code); load();
}
async function removeMember(m){
  if(!confirm("Remove " + m.name + "?")) return;
  await sb.rpc("admin_remove_member", { p_id: m.id }); load();
}
$("resetBtn").onclick = async () => {
  if(prompt("This clears ALL selections so everyone can pick again.\nType RESET to confirm.") !== "RESET") return;
  const { data } = await sb.rpc("admin_reset");
  note(data && data.ok ? "All selections cleared." : "Reset failed."); load();
};
$("copyPublic").onclick = () => copy(root, "Public link copied. Members also need their own access code.");
$("csvBtn").onclick = () => {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = ["No.,Member,Contact,Assigned number,Status,Selected at"].concat(D.members.map((m, i) =>
    [i + 1, q(m.name), q(m.contact), m.number || "", m.number ? "Selected" : "Pending", q(m.selected_at || "")].join(",")));
  const a = el("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "merry-go-round-results.csv"; a.click();
};

enter();
</script>
</body>
</html>
